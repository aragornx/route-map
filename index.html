      let renderedFollow = false;
      let lastTileErrorAt = 0;
      let onSelectPoint = () => {};
      const markers = new Map();
      const lines = new Map();

      function onTileError() {
        const now = Date.now();
        if (now - lastTileErrorAt < CONFIG.TILE_ERROR_COOLDOWN_MS) return;
        lastTileErrorAt = now;
        UI.toast(I18N.tilesError);
      }

      /**
       * Creates the Leaflet map. Returns false when Leaflet failed to load.
       * @param {{onUserPan: () => void, onSelectPoint: (order: number) => void}} options
       * @returns {boolean}
       */
      function init(options) {
        const container = document.getElementById("map");
        if (typeof L === "undefined") {
          const p = document.createElement("p");
          p.className = "map-error";
          p.textContent = I18N.leafletMissing;
          container.replaceChildren(p);
          return false;
        }
        onSelectPoint = options.onSelectPoint;
        const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        map = L.map(container, {
          preferCanvas: true,
          zoomControl: false,
          zoomAnimation: !still,
          fadeAnimation: !still,
          markerZoomAnimation: !still,
        }).setView(CONFIG.MAP_DEFAULT_CENTER, CONFIG.MAP_DEFAULT_ZOOM);
        L.control.zoom({ position: "bottomright" }).addTo(map);
        L.tileLayer(CONFIG.TILE_URL, {
          maxZoom: CONFIG.MAP_MAX_ZOOM,
          attribution: CONFIG.TILE_ATTRIBUTION,
        }).on("tileerror", onTileError).addTo(map);
        lineRenderer = L.canvas({ tolerance: CONFIG.SEGMENT_TAP_TOLERANCE });
        segmentLayer = L.layerGroup().addTo(map);
        pointLayer = L.layerGroup().addTo(map);
        gpsLayer = L.layerGroup().addTo(map);
        map.on("dragstart", options.onUserPan);
        return true;
      }

      function popupContent(point) {
        const { lat, lon } = point;
        const url = "https://www.google.com/maps/dir/?api=1"
          + `&destination=${lat},${lon}&travelmode=walking`;
        return Util.el(
          "div",
          {},
          Util.el("div", { class: "popup-title", text: `${point.order}. ${point.address}` }),
          point.time && Util.el("p", { class: "popup-line", text: point.time }),
          point.description && Util.el("p", { class: "popup-line", text: point.description }),
          Util.el("a", {
            class: "popup-link",
            href: url,
            target: "_blank",
            rel: "noopener noreferrer",
            text: I18N.navigate,
          }),
        );
      }

      function makeMarker({ point, index }) {
        const badge = Util.el("span", { class: "badge", text: String(point.order) });
        badge.style.background = Model.colorFor(index);
        const size = CONFIG.MARKER_SIZE;
        const icon = L.divIcon({
          className: "pin",
          html: badge,
          iconSize: [size, size],
          iconAnchor: [size / 2, size / 2],
          popupAnchor: [0, -size / 2],
        });
        return L.marker([point.lat, point.lon], { icon, title: point.address })
          .bindPopup(popupContent(point))
          .on("click", () => onSelectPoint(point.order));
      }

      /**
       * Adds, replaces and removes layers so that only changed items are redrawn.
       * @param {Map} cache key -> {sig, layer}
       * @param {{key: string|number, sig: string, data: object}[]} items
       * @param {(data: object) => L.Layer} make
       */
      function syncLayers(group, cache, items, make) {
        const seen = new Set();
        for (const { key, sig, data } of items) {
          seen.add(key);
          const cached = cache.get(key);
          if (cached?.sig === sig) continue;
          if (cached) group.removeLayer(cached.layer);
          cache.set(key, { sig, layer: make(data).addTo(group) });
        }
        for (const [key, cached] of cache) {
          if (seen.has(key)) continue;
          group.removeLayer(cached.layer);
          cache.delete(key);
        }
      }

      function drawPoints(points) {
        const items = [];
        points.forEach((point, index) => {
          if (!Model.hasCoords(point)) return;
          const sig = [point.lat, point.lon, index, point.address, point.time, point.description]
            .join("|");
          items.push({ key: point.order, sig, data: { point, index } });
        });
        syncLayers(pointLayer, markers, items, makeMarker);
      }

      function segmentPopup(segment) {
        const values = {
          from: segment.from,
          to: segment.to,
          distance: Model.formatDistance(segment.distance),
          duration: Model.formatDuration(segment.duration),
        };
        const template = segment.status === "ok" ? I18N.segmentLabel : I18N.segmentFallback;
        return Util.el("div", { text: Util.fmt(template, values) });
      }

      // Odd segments are dashed so overlapping stretches stay distinguishable.
      function makeLine({ segment, index }) {
        const fallback = segment.status === "fallback";
        let dashArray = index % 2 === 1 ? CONFIG.SEGMENT_DASH : null;
        if (fallback) dashArray = CONFIG.FALLBACK_DASH;
        return L.polyline(segment.coords, {
          renderer: lineRenderer,
          color: Model.colorFor(index),
          weight: fallback ? CONFIG.FALLBACK_WEIGHT : CONFIG.SEGMENT_WEIGHT,
          opacity: CONFIG.SEGMENT_OPACITY,
          dashArray,
        }).bindPopup(segmentPopup(segment));
      }

      function drawSegments({ points, segments }) {
        const indexByOrder = new Map(points.map((p, i) => [p.order, i]));
        const items = segments.map((segment) => {
          const index = indexByOrder.get(segment.from) ?? 0;
          const sig = [segment.status, segment.coords.length, segment.distance, index].join("|");
          return { key: `${segment.from}-${segment.to}`, sig, data: { segment, index } };
        });
        syncLayers(segmentLayer, lines, items, makeLine);
      }

      /**
       * Centres the map on a point and opens its popup.
       * @param {number} order
       * @returns {boolean} false when the point has no marker yet
       */
      function focusPoint(order) {
        const marker = markers.get(order)?.layer;
        if (!map || !marker) return false;
        map.setView(marker.getLatLng(), Math.max(map.getZoom(), CONFIG.FOCUS_ZOOM));
        marker.openPopup();
        return true;
      }

      /** @param {Point[]} points Fits the view to all points that have coordinates. */
      function fitAll(points) {
        const coords = points.filter(Model.hasCoords).map((p) => [p.lat, p.lon]);
        if (!map || coords.length === 0) return;
        map.fitBounds(L.latLngBounds(coords), fitOptions());
      }

      // Leaves room for the side panel on wide screens and the bottom sheet on phones.
      function fitOptions() {
        const wide = window.matchMedia(CONFIG.WIDE_QUERY).matches;
        const left = CONFIG.PANEL_WIDTH_PX + CONFIG.FIT_PADDING_TOP_LEFT[0];
        return {
          paddingTopLeft: wide ? [left, CONFIG.FIT_PADDING_TOP_LEFT[1]] : CONFIG.FIT_PADDING_TOP_LEFT,
          paddingBottomRight: wide ? [40, 40] : CONFIG.FIT_PADDING_BOTTOM_RIGHT,
          maxZoom: CONFIG.FIT_MAX_ZOOM,
        };
      }

      /**
       * Fits the view to one route segment and opens its popup.
       * @param {string} key Segment id, e.g. "2-3"
       * @returns {boolean} false when the segment is not drawn yet
       */
      function focusSegment(key) {
        const line = lines.get(key)?.layer;
        if (!map || !line) return false;
        map.fitBounds(line.getBounds(), fitOptions());
        line.openPopup(line.getCenter());
        return true;
      }

      function drawPosition(last) {
        const latlng = [last.lat, last.lon];
        if (gpsDot) {
          gpsDot.setLatLng(latlng);
          gpsAccuracy.setLatLng(latlng).setRadius(last.accuracy);
          return;
        }
        gpsAccuracy = L.circle(latlng, {
          radius: last.accuracy,
          color: CONFIG.GPS_COLOR,
          weight: 1,
          fillOpacity: 0.12,
          interactive: false,
        }).addTo(gpsLayer);
        gpsDot = L.circleMarker(latlng, {
          radius: CONFIG.GPS_DOT_RADIUS,
          color: CONFIG.GPS_OUTLINE_COLOR,
          weight: 3,
          fillColor: CONFIG.GPS_COLOR,
          fillOpacity: 1,
          interactive: false,
        }).addTo(gpsLayer);
      }

      function clearPosition() {
        gpsLayer.clearLayers();
        gpsDot = null;
        gpsAccuracy = null;
      }

      function followPosition(last) {
        const latlng = [last.lat, last.lon];
        if (map.getZoom() < CONFIG.GPS_FOLLOW_ZOOM) map.setView(latlng, CONFIG.GPS_FOLLOW_ZOOM);
        else map.panTo(latlng);
      }

      /** @param {typeof state} s */
      function render(s) {
        if (!map) return;
        drawSegments(s);
        drawPoints(s.points);
        const { gps } = s;
        const moved = gps.last !== renderedLast;
        if (gps.last === null) {
          if (renderedLast !== null) clearPosition();
        } else {
          if (moved) drawPosition(gps.last);
          if (gps.follow && (moved || !renderedFollow)) followPosition(gps.last);
        }
        renderedLast = gps.last;
        renderedFollow = gps.follow;
      }

      return { init, render, focusPoint, focusSegment, fitAll };
    })();

    /* ===== Gps ===== */
    const Gps = (() => {
      let watchId = null;
      let wakeLock = null;
      let lastAcceptedAt = 0;

      function patchGps(patch) {
        setState({ gps: { ...state.gps, ...patch } });
      }

      async function requestWakeLock() {
        if (!("wakeLock" in navigator)) return;
        try {
          const lock = await navigator.wakeLock.request("screen");
          if (watchId === null) {
            lock.release().catch((error) => console.error("Wake Lock release failed", error));
            return;
          }
          wakeLock = lock;
          lock.addEventListener("release", () => {
            if (wakeLock === lock) wakeLock = null;
          });
        } catch (error) {
          console.error("Wake Lock request failed", error);
        }
      }

      function releaseWakeLock() {
        const lock = wakeLock;
        wakeLock = null;
        lock?.release().catch((error) => console.error("Wake Lock release failed", error));
      }

      function onPosition(position) {
        const now = Date.now();
        if (now - lastAcceptedAt < CONFIG.GPS_RENDER_MS) return;
        lastAcceptedAt = now;
        const { latitude, longitude, accuracy } = position.coords;
        patchGps({
          last: { lat: latitude, lon: longitude, accuracy, ts: position.timestamp },
        });
      }

      function onError(error) {
        console.error("Geolocation error", error.code, error.message);
        if (error.code === error.PERMISSION_DENIED) {
          stop();
          UI.toast(I18N.gpsDenied, CONFIG.TOAST_LONG_MS);
        } else if (error.code === error.POSITION_UNAVAILABLE) {
          UI.toast(I18N.gpsUnavailable);
        } else if (error.code === error.TIMEOUT) {
          UI.toast(I18N.gpsTimeout);
        } else {
          UI.toast(I18N.gpsError);
        }
      }

      /** Starts tracking. Must be called from a user gesture to trigger the permission prompt. */
      function start() {
        if (watchId !== null) return;
        if (!window.isSecureContext) {
          UI.toast(I18N.gpsInsecure, CONFIG.TOAST_LONG_MS);
          return;
        }
        if (!navigator.geolocation) {
          UI.toast(I18N.gpsUnsupported);
          return;
        }
        lastAcceptedAt = 0;
        watchId = navigator.geolocation.watchPosition(onPosition, onError, CONFIG.GPS_OPTIONS);
        patchGps({ on: true, follow: true });
        requestWakeLock();
      }

      /** Stops tracking and clears the last known position. */
      function stop() {
        if (watchId === null) return;
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        releaseWakeLock();
        patchGps({ on: false, follow: false, last: null });
      }

      /** @param {boolean} value Whether the map should follow the user's position. */
      function setFollow(value) {
        if (state.gps.follow === value) return;
        if (value && state.gps.last === null) return;
        patchGps({ follow: value });
      }

      /** Re-acquires the wake lock when the page becomes visible again. */
      function init() {
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible" && watchId !== null && !wakeLock) {
            requestWakeLock();
          }
        });
      }

      return { init, start, stop, setFollow };
    })();

    /* ===== Self test (open with ?selftest) ===== */
    function selfTest() {
      let failed = 0;
      const check = (name, ok) => {
        if (!ok) failed += 1;
        console.assert(ok, `selftest failed: ${name}`);
      };
      const toPoints = (text) => CSV.toPoints(CSV.parse(text));

      check("quoted separator", CSV.parse("a;\"b;c\";d")[0][1] === "b;c");
      check("escaped quote", CSV.parse("\"x \"\"y\"\"\";2")[0][0] === "x \"y\"");
      check("BOM", CSV.parse("\uFEFForder,address\n1,A")[0][0] === "order");
      check("tab separator", CSV.parse("1\tA\t09:00")[0].length === 3);
      check("CRLF and blank rows", CSV.parse("1,A\r\n\r\n2,B\r\n").length === 2);
      check("windows-1250 fallback", CSV.decode(new Uint8Array([0xb3]).buffer) === "\u0142");
      const sorted = toPoints("order_no;address\n10;J\n9;I\n2;B");
      check("alias header + numeric sort", sorted.points.map((p) => p.order).join() === "2,9,10");
      check("duplicate order", toPoints("order,address\n1,A\n1,B").issues[0].code === "duplicate");
      check("missing address", toPoints("order,address\n1,").issues[0].code === "noAddress");
      const coords = toPoints("order,address,lat,lon\n1,A,\"51,5\",15.25\n2,B,95,10");
      check("decimal comma", coords.points[0].lat === 51.5 && coords.points[0].status === "ok");
      check("bad coords fall back to address", coords.issues[0].code === "badCoords");
      check("headerless default columns", toPoints("1;Rynek;09:00;opis").points[0].time === "09:00");
      const many = Array.from({ length: CONFIG.MAX_POINTS + 5 }, (_, i) => `${i + 1},A`).join("\n");
      const limited = toPoints(many);
      check("point limit", limited.points.length === CONFIG.MAX_POINTS && limited.issues[0].code === "tooMany");
      check("palette wraps", Model.colorFor(10) === Model.colorFor(0));
      selfTestLibrary(check);
      selfTestGeo(check);
      selfTestRouting(check);
      selfTestStorage(check);
      console.info(failed === 0 ? "selftest: all passed" : `selftest: ${failed} failed`);
    }

    function selfTestStorage(check) {
      const saved = Model.restoreSaved({
        dayKey: 5,
        issues: [{ line: 2, code: "noAddress" }, { line: 3, code: "bogus" }],
        points: [
          { order: 1, address: "A", lat: 41.9, lon: 12.4, status: "ok" },
          { order: 2, address: "B", lat: 999, lon: 1, status: "ok" },
          { order: 3, address: "C", status: "no-geo" },
          { address: "no order" },
        ],
      });
      check("restore drops invalid", saved.points.map((p) => p.order).join() === "1,2,3");
      check("restore statuses", saved.points.map((p) => p.status).join() === "ok,pending,no-geo");
      check("restore issues", saved.issues.length === 1 && saved.dayKey === null);
      check("restore empty", Model.restoreSaved(null) === null && Model.restoreSaved({ points: [] }) === null);
    }

    function selfTestRouting(check) {
      const meters = Model.haversine({ lat: 0, lon: 0 }, { lat: 0, lon: 1 });
      check("haversine 1 degree", Math.abs(meters - 111195) < 100);
      check("haversine zero", Model.haversine({ lat: 5, lon: 5 }, { lat: 5, lon: 5 }) === 0);
      const line = [[0, 0], [0, 1], [0, 2], [1, 3]];
      check("simplify drops collinear", Model.simplify(line, 0.001).length === 3);
      check("simplify keeps ends", Model.simplify([[0, 0], [1, 1]], 1).length === 2);
      const a = { lat: 41.123456, lon: 12.1 };
      const b = { lat: 41.2, lon: 12.2 };
      check("route key rounding", Model.routeKey(a, b) === "41.12346,12.10000|41.20000,12.20000");
      const osrm = Model.parseOsrm({
        code: "Ok",
        routes: [{ distance: 10, duration: 5, geometry: { coordinates: [[12, 41], [12.1, 41.1]] } }],
      });
      check("osrm lat/lon swap", osrm?.coords[0][0] === 41 && osrm.coords[0][1] === 12);
      check("osrm malformed", [null, { code: "NoRoute" }, { code: "Ok", routes: [] }]
        .every((json) => Model.parseOsrm(json) === null));
      const pts = [1, 2, 3, 4].map((order) => ({ order, lat: order === 3 ? null : 1, lon: 1 }));
      check("segments skip missing", Model.segmentPairs(pts).map((p) => p.id).join() === "1-2");
      check("format meters", Model.formatDistance(850.4) === "850 m");
      check("format km", Model.formatDistance(4098.8) === "4,1 km");
      check("format minutes", Model.formatDuration(612) === "10 min");
      check("format hours", Model.formatDuration(3280) === "55 min" && Model.formatDuration(5400) === "1 h 30 min");
      check("planned span", Model.plannedSpan([{ time: "07:20" }, { time: "18:00–19:15" }]) === "07:20\u201319:15");
      check("planned span none", Model.plannedSpan([{ time: "rano" }]) === "");
      const near = Model.nearestPoint({ lat: 0, lon: 0 }, [
        { order: 1, lat: 0, lon: 1 }, { order: 2, lat: 0, lon: 0.1 }, { order: 3, lat: null, lon: null },
      ]);
      check("nearest point", near?.point.order === 2);
    }

    function selfTestGeo(check) {
      check("normalize address", Model.normalizeAddress("  Rynek   1, ZG ") === "rynek 1, zg");
      check("city appended", Model.buildQuery("Rynek 1", "Zielona Góra") === "Rynek 1, Zielona Góra");
      check("city skipped", Model.buildQuery("Rynek 1, Roma", "Zielona Góra") === "Rynek 1, Roma");
      const nominatim = Model.parseNominatim([{ lat: "41.9", lon: "12.4" }]);
      check("nominatim parse", nominatim?.lat === 41.9 && nominatim.lon === 12.4);
      check("nominatim empty", Model.parseNominatim([]) === null && Model.parseNominatim({}) === null);
      const photon = Model.parsePhoton({ features: [{ geometry: { coordinates: [12.4, 41.9] } }] });
      check("photon lon/lat order", photon?.lat === 41.9 && photon.lon === 12.4);
      check("photon malformed", Model.parsePhoton({ features: [] }) === null);
      const inputs = ["41.9, 12.45", "41,9;12,45", "41.9 12.45", "41.9,12.45", "41,9 12,45"];
      check("manual coords formats", inputs.every((t) => CSV.parseLatLon(t)?.lon === 12.45));
      check("manual coords invalid", ["", "abc", "91, 10", "1, 2, 3"].every((t) => CSV.parseLatLon(t) === null));
    }

    function selfTestLibrary(check) {
      const days = ["10. j.csv", "9. i.csv", "b.csv", "a.csv", "2. x.csv"]
        .map(LibraryCore.parseDayFile).sort(LibraryCore.compareDays);
      check("day sort", days.map((d) => d.title).join() === "x,i,j,a,b");
      check("day with spaces", LibraryCore.parseDayFile("3.   day - x.csv").title === "day - x");
      check("unsafe paths", ["../a.csv", "/a.csv", "a\\b.csv", "C:/a.csv", "a//b.csv"]
        .every((p) => !LibraryCore.isSafePath(p)));
      check("zip junk skipped", ["__MACOSX/r/1. a.csv", "r/.hidden.csv", "r/readme.txt"]
        .every((p) => LibraryCore.locateEntry(p) === null));
      check("zip trip from folder", LibraryCore.locateEntry("x/rzym/1. a.csv").trip === "rzym");
      check("zip root file", LibraryCore.locateEntry("1. a.csv").trip === CONFIG.OTHER_TRIP);
      check("flat prefix", LibraryCore.locateFlatFile("rzym__1. a.csv").trip === "rzym");
      const index = LibraryCore.parseIndex({
        version: 1,
        trips: [{ id: "rzym", days: [{ file: "rzym/1. a.csv" }, { file: "../x.csv" }] }, {}],
      });
      check("index validation", index.length === 1 && index[0].days.length === 1);
      check("index version", LibraryCore.parseIndex({ version: 2, trips: [] }).length === 0);
      const merged = LibraryCore.mergeLibrary(index, [
        { key: "rzym/1. a.csv", trip: "rzym", order: 1, title: "a" },
        { key: "rzym/2. b.csv", trip: "rzym", order: 2, title: "b" },
      ]);
      const [first, second] = merged[0].days;
      check("local wins", first.source === "local" && first.overridden && !second.overridden);
      check("builtin url encoding", LibraryCore.builtinUrl("r z/1. \u0105.csv") === "data/r%20z/1.%20%C4%85.csv");
    }

    /* ===== Planner (geocode pipeline) ===== */
    const Planner = (() => {
      /** Applies `patch` to the points whose order is in `orders`. */
      function updatePoints(orders, patch) {
        const wanted = new Set(orders);
        setState({
          points: state.points.map((p) => (wanted.has(p.order) ? { ...p, ...patch } : p)),
        });
      }

      /** @returns {Promise<boolean>} false when stopped early (cancelled or geocoder down) */
      async function geocodePending(signal) {
        const pending = state.points.filter((p) => p.status === "pending");
        if (pending.length === 0) return true;
        if (!navigator.onLine) {
          updatePoints(pending.map((p) => p.order), { status: "no-geo" });
          UI.toast(I18N.geocodeOffline);
          return false;
        }
        let failures = 0;
        for (const [index, point] of pending.entries()) {
          setState({ progress: { label: I18N.geocoding, done: index, total: pending.length } });
          try {
            const city = state.settings.city;
            const coords = await Geocoder.geocode(point.address, { signal, city });
            if (signal.aborted) return false;
            updatePoints([point.order], coords ? { ...coords, status: "ok" } : { status: "no-geo" });
            failures = 0;
          } catch (error) {
            if (error.name === "AbortError" || signal.aborted) return false;
            updatePoints([point.order], { status: "no-geo" });
            failures += 1;
            if (failures >= CONFIG.GEOCODE_MAX_FAILURES) {
              updatePoints(pending.slice(index + 1).map((p) => p.order), { status: "no-geo" });
              setState({ progress: null });
              UI.toast(I18N.geocodeFailed);
              return false;
            }
          }
        }
        setState({ progress: null });
        return true;
      }

      /**
       * Resolves missing coordinates for the current points, then routes every segment.
       * @param {AbortSignal} signal Aborted when another day is loaded.
       */
      async function run(signal) {
        try {
          const completed = await geocodePending(signal);
          if (signal.aborted) return;
          MapView.fitAll(state.points);
          await routeAll(signal);
          if (signal.aborted) return;
          const missing = state.points.filter((p) => p.status === "no-geo").length;
          if (completed && missing > 0) UI.toast(Util.fmt(I18N.geocodeMissing, { n: missing }));
        } catch (error) {
          if (error.name !== "AbortError") console.error("Planner failed", error);
        }
      }

      /** Straight dashed line used when a walking route is unavailable. */
      function fallbackSegment({ a, b }) {
        const distance = Model.haversine(a, b);
        return {
          coords: [[a.lat, a.lon], [b.lat, b.lon]],
          distance,
          duration: distance / CONFIG.WALK_SPEED_MPS,
          status: "fallback",
        };
      }

      async function routeAll(signal) {
        const pairs = Model.segmentPairs(state.points);
        if (pairs.length === 0) {
          setState({ segments: [] });
          return;
        }
        const results = new Map();
        let failures = 0;
        let routerDown = !navigator.onLine;
        Router.reset();
        const publish = () => setState({
          segments: pairs.filter((p) => results.has(p.id))
            .map((p) => ({ from: p.a.order, to: p.b.order, ...results.get(p.id) })),
          progress: { label: I18N.routing, done: results.size, total: pairs.length },
        });
        setState({ progress: { label: I18N.routing, done: 0, total: pairs.length } });
        await Util.mapPool(pairs, CONFIG.ROUTE_CONCURRENCY, async (pair) => {
          if (signal.aborted) return;
          let segment;
          if (routerDown) {
            segment = fallbackSegment(pair);
          } else {
            try {
              segment = { ...(await Router.route(pair.a, pair.b, { signal })), status: "ok" };
              failures = 0;
            } catch (error) {
              if (error.name === "AbortError" || signal.aborted) return;
              console.error("Routing failed", error);
              failures += 1;
              routerDown = failures >= CONFIG.ROUTE_MAX_FAILURES;
              segment = fallbackSegment(pair);
            }
          }
          if (signal.aborted) return;
          results.set(pair.id, segment);
          publish();
        });
        if (signal.aborted) return;
        setState({ progress: null });
        const fallbacks = [...results.values()].filter((r) => r.status === "fallback").length;
        if (fallbacks === 0) return;
        const offline = !navigator.onLine;
        UI.toast(offline ? I18N.routingOffline : Util.fmt(I18N.routesFallback, { n: fallbacks }));
      }

      /** Queues points without a location for another geocoding attempt. */
      function retryMissing() {
        const missing = state.points.filter((p) => p.status === "no-geo");
        updatePoints(missing.map((p) => p.order), { status: "pending" });
      }

      /** Sets coordinates entered by the user and remembers them for the address. */
      function setManual(order, coords) {
        updatePoints([order], { ...coords, status: "ok" });
        const point = state.points.find((p) => p.order === order);
        if (point?.address) Geocoder.remember(point.address, coords, state.settings.city);
      }

      return { run, retryMissing, setManual };
    })();

    /* ===== App ===== */
    const App = (() => {
      let renderQueued = false;
      let jobController = null;
      let persistTimer = 0;
      let persisted = { points: null, dayKey: null };

      function scheduleRender() {
        if (renderQueued) return;
        renderQueued = true;
        requestAnimationFrame(() => {
          renderQueued = false;
          MapView.render(state);
          UI.render(state);
        });
      }

      function toggleGps() {
        if (state.gps.on) Gps.stop();
        else Gps.start();
      }

      // Cancels the previous load/geocode job so late results cannot overwrite new data.
      function beginJob() {
        jobController?.abort();
        jobController = new AbortController();
        setState({ progress: null });
        return jobController.signal;
      }

      function showCsv(text, label, dayKey, signal) {
        const { points, issues } = CSV.toPoints(CSV.parse(text));
        setState({ points, segments: [], issues, dayLabel: label, dayKey, activeOrder: null });
        if (points.length === 0) UI.toast(I18N.csvEmpty);
        else if (issues.length > 0) UI.toast(Util.fmt(I18N.csvIssues, { n: issues.length }));
        MapView.fitAll(points);
        return Planner.run(signal);
      }

      function saveSettings(patch) {
        const settings = { ...state.settings, ...patch };
        Store.set("settings", settings);
        setState({ settings });
      }

      async function refreshLibrary() {
        setState({ library: await Library.list() });
      }

      async function openDay(key) {
        const signal = beginJob();
        let loaded;
        try {
          loaded = await Library.load(key, { signal });
        } catch (error) {
          if (error.name === "AbortError") return;
          console.error("Day load failed", error);
          UI.toast(I18N.dayLoadError);
          return;
        }
        if (signal.aborted) return;
        saveSettings({ lastDay: key });
        await showCsv(loaded.text, loaded.label, key, signal);
      }

      async function importFiles(files) {
        try {
          const confirmOverwrite = (n) => UI.confirm(Util.fmt(I18N.importOverwrite, { n }));
          const { added, skipped } = await Library.importFiles(files, { confirmOverwrite });
          await refreshLibrary();
          const parts = [
            added > 0 && Util.fmt(I18N.importDone, { n: added }),
            skipped > 0 && Util.fmt(I18N.importSkipped, { n: skipped }),
          ].filter(Boolean);
          UI.toast(parts.length > 0 ? parts.join(" ") : I18N.importNothing);
        } catch (error) {
          console.error("Import failed", error);
          UI.toast(I18N.importFailed);
        }
      }

      async function deleteDay(key, title) {
        if (!(await UI.confirm(Util.fmt(I18N.deleteConfirm, { title })))) return;
        try {
          await Library.remove(key);
          await refreshLibrary();
          UI.toast(I18N.dayDeleted);
        } catch (error) {
          console.error("Delete failed", error);
          UI.toast(I18N.importFailed);
        }
      }

      async function startLibrary() {
        const { persistent } = await Library.init();
        if (!persistent) UI.toast(I18N.storageUnavailable, CONFIG.TOAST_LONG_MS);
        await refreshLibrary();
        const lastDay = state.settings.lastDay;
        const exists = state.library.some((trip) => trip.days.some((day) => day.key === lastDay));
        if (exists && state.points.length === 0) await openDay(lastDay);
      }

      async function loadFile(file) {
        if (file.size > CONFIG.MAX_CSV_BYTES) {
          const mb = CONFIG.MAX_CSV_BYTES / (1024 * 1024);
          UI.toast(Util.fmt(I18N.csvTooBig, { mb }));
          return;
        }
        const signal = beginJob();
        let text;
        try {
          text = CSV.decode(await file.arrayBuffer());
        } catch (error) {
          console.error("CSV read failed", error);
          UI.toast(I18N.csvReadError);
          return;
        }
        if (!signal.aborted) await showCsv(text, file.name, null, signal);
      }

      function downloadSample() {
        const blob = new Blob([`\uFEFF${CSV.SAMPLE}`], { type: "text/csv;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        Util.el("a", { href: url, download: CONFIG.SAMPLE_FILE_NAME }).click();
        setTimeout(() => URL.revokeObjectURL(url), CONFIG.BLOB_REVOKE_MS);
      }

      function clearData() {
        beginJob();
        setState({
          points: [], segments: [], issues: [], dayLabel: "", dayKey: null, activeOrder: null,
        });
        saveSettings({ lastDay: null });
        UI.toast(I18N.dataCleared);
      }

      async function locatePoint(order) {
        const input = await UI.prompt(I18N.promptCoords);
        if (input === null || input.trim() === "") return;
        const coords = CSV.parseLatLon(input);
        if (!coords) {
          UI.toast(I18N.badCoords);
          return;
        }
        Planner.setManual(order, coords);
        Planner.run(beginJob());
      }

      function retryGeocode() {
        const signal = beginJob();
        Planner.retryMissing();
        Planner.run(signal);
      }

      // On phones the open sheet would hide the segment, so it collapses first.
      function selectLeg(key) {
        if (!window.matchMedia(CONFIG.WIDE_QUERY).matches) setState({ sheetOpen: false });
        MapView.focusSegment(key);
      }

      function selectPoint(order, action) {
        if (action === "locate") {
          locatePoint(order);
          return;
        }
        setState({ activeOrder: order });
        if (!MapView.focusPoint(order)) UI.toast(I18N.noMarker);
      }

      // Saves the loaded day so it reopens instantly (also offline) on the next start.
      function schedulePersist() {
        if (state.points === persisted.points && state.dayKey === persisted.dayKey) return;
        clearTimeout(persistTimer);
        persistTimer = setTimeout(() => {
          persisted = { points: state.points, dayKey: state.dayKey };
          const { points, issues, dayLabel, dayKey } = state;
          Store.set("points", { points, issues, dayLabel, dayKey });
        }, CONFIG.PERSIST_DEBOUNCE_MS);
      }

      function restoreSaved() {
        const saved = Model.restoreSaved(Store.get("points", null));
        if (!saved) return;
        persisted = { points: saved.points, dayKey: saved.dayKey };
        setState({ ...saved, segments: [] });
        MapView.fitAll(saved.points);
        Planner.run(beginJob());
      }

      function watchConnectivity() {
        window.addEventListener("offline", () => UI.toast(I18N.offline, CONFIG.TOAST_LONG_MS));
        window.addEventListener("online", () => UI.toast(I18N.online));
        if (!navigator.onLine) UI.toast(I18N.offline, CONFIG.TOAST_LONG_MS);
      }

      // Last-resort net so a bug never fails silently.
      function watchUnexpectedErrors() {
        window.addEventListener("error", (event) => {
          console.error("Unhandled error", event.error ?? event.message);
          UI.toast(I18N.unexpectedError);
        });
        window.addEventListener("unhandledrejection", (event) => {
          if (event.reason?.name === "AbortError") return;
          console.error("Unhandled rejection", event.reason);
          UI.toast(I18N.unexpectedError);
        });
      }

      function init() {
        if (location.search.includes("selftest")) selfTest();
        setState({ settings: { ...state.settings, ...Store.get("settings", {}) } });
        subscribe(scheduleRender);
        UI.init({
          onToggleGps: toggleGps,
          onCenter: () => Gps.setFollow(true),
          onToggleSheet: () => setState({ sheetOpen: !state.sheetOpen }),
          onSelectPoint: selectPoint,
          onSelectLeg: selectLeg,
          onLoadFile: loadFile,
          onSample: downloadSample,
          onClear: clearData,
          onImport: importFiles,
          onOpenDay: openDay,
          onDeleteDay: deleteDay,
          onRetryGeocode: retryGeocode,
          onCityChange: (city) => saveSettings({ city }),
          onSetTheme: (theme) => saveSettings({ theme }),
          onLayoutChange: scheduleRender,
        });
        MapView.init({
          onUserPan: () => Gps.setFollow(false),
          onSelectPoint: (order) => setState({ activeOrder: order }),
        });
        Gps.init();
        scheduleRender();
        restoreSaved();
        subscribe(schedulePersist);
        watchConnectivity();
        watchUnexpectedErrors();
        startLibrary();
      }

      return { init };
    })();

    App.init();
  </script>
</body>
</html>
